[platformio]
default_envs = esp32-s3-st7735
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_boards_json
extra_configs = 
	boards/*.ini
	boards/*/*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
board_build.variants_dir = boards
board_build.filesystem = littlefs
build_src_flags = 
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing
build_src_filter = 
	+<*>
	-<.git/>
	-<.svn/>
	-<modules/bjs_interpreter/mqjs_stdlib.c>
build_flags = 
	-DBRUCE_VERSION='"dev"'
	-DEEPROMSIZE=128
	-DLH=8
	-DLW=6
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"Homebrew"'
	-DFASTLED_RMT_BUILTIN_DRIVER=1
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DGEN_MQJS_HEADERS
	-DMBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
	-DCONFIG_MBEDTLS_ECDH_C=1
	-DCONFIG_MBEDTLS_AES_C=1
	-DCONFIG_MBEDTLS_CTR_DRBG_C=1
extra_scripts = 
	pre:patch.py
	pre:pre_build_current_year.py
	pre:gen_mqjs_headers.py
	pre:patch_library_conflicts.py
	post:build.py
lib_deps = 
	https://github.com/sayacom/WireGuard-ESP32-Arduino#feature/esp-netif
	https://github.com/bmorcelli/IRremoteESP8266
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce@1.17.2-bruce.1
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce@1.3.3-bruce.1
	https://github.com/huckor/BER-TLV.git
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/bmorcelli/ESP-Amiibolink
	https://github.com/rennancockles/SimpleCLI
	https://github.com/whywilson/ESP-PN532BLE
	https://github.com/whywilson/ESP-PN532-UART
	https://github.com/whywilson/ESP-PN532Killer
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson
	https://github.com/bmorcelli/rc-switch
	ESP8266Audio@^2.4.1
	earlephilhower/ESP8266SAM@^1.1.0
	mikalhart/TinyGPSPlus
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@^2.3.9
	nrf24/RF24 @ 1.4.11
	Adafruit Si4713 Library@1.2.3
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	mquickjs=https://github.com/BruceDevices/mquickjs#0.0.6
	https://github.com/bmorcelli/OneWire#patch-1
	https://github.com/bmorcelli/ESP32-PsRamFS#patch-1
	bitbank2/AnimatedGIF
	bitbank2/PNGdec @ ^1.1.2
	ESP32Async/ESPAsyncWebServer
	fastled/FastLED @ 3.9.0
	jgromes/RadioLib @ ^7.4.0
monitor_speed = 115200

[env_light]
extends = env
build_flags = 
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DLITE_VERSION=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

[env_4mb]
extends = env
build_flags = 
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true
	-include Arduino.h
lib_ignore = 
	FastLED
	ESP8266Audio
	ESP8266SAM

[env:esp32-s3-st7735]
extends = env
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 16MB
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-st7735>
build_flags = 
	${env.build_flags}
	-Iboards/esp32-s3-st7735
	-DUSB_as_HID=1
	-Os
	-DCORE_DEBUG_LEVEL=5
	-DREDRAW_DELAY=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DBOARD_HAS_PSRAM
	
	-DESP32_S3_ST7735
	-DDEVICE_NAME='"esp32-s3-st7735"'
	
	-DGROVE_SDA=18
	-DGROVE_SCL=8
	
	-DIR_TX_PINS='{{"Pin TX 1", 17}}'
	-DIR_RX_PINS='{{"Pin RX 2", 13}}'
	-DTXLED=12
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	
	-DSDCARD_CS=1
	-DSDCARD_SCK=40
	-DSDCARD_MISO=41
	-DSDCARD_MOSI=42
	
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DST7735_BLACKTAB
	-DTFT_RGB_ORDER=TFT_BGR
	-DSMOOTH_FONT=1
	-DTFT_CS=45
	-DTFT_DC=21
	-DTFT_RST=14
	-DTFT_MOSI=42
	-DTFT_SCLK=40
	-DTFT_MISO=41
	-DTFT_BL=2
	-DTFT_BACKLIGHT_ON=HIGH
	-DUSE_HSPI_PORT=1
	
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1
	
	-DHAS_BTN=1
	-DBTN_ALIAS='"Mid"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW
	
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=6
	-DCC1101_SS_PIN=7
	-DCC1101_MOSI_PIN=42
	-DCC1101_SCK_PIN=40
	-DCC1101_MISO_PIN=41
	
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=9
	-DNRF24_SS_PIN=11
	-DNRF24_MOSI_PIN=42
	-DNRF24_SCK_PIN=40
	-DNRF24_MISO_PIN=41
	
	-DSPI_SCK_PIN=40
	-DSPI_MOSI_PIN=42
	-DSPI_MISO_PIN=41
	-DSPI_SS_PIN=7
	-DSPI_FREQUENCY=10000000
	-DSPI_READ_FREQUENCY=8000000
lib_deps = ${env.lib_deps}
platform_packages = espressif/toolchain-xtensa-esp32s3@12.2.0+20230208
