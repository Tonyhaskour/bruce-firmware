[env:esp32-s3-st7735]
board = esp32-s3-devkitc-1
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-st7735>
build_flags = 
	${env.build_flags}
	-Iboards/esp32-s3-st7735
	-DUSB_as_HID=1
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DREDRAW_DELAY=1
	-DALLOW_ALL_GPIO_FOR_IR_RF=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	
	-DESP32_S3_ST7735
	-DDEVICE_NAME='"esp32-s3-st7735"'
	
	-DGROVE_SDA=18
	-DGROVE_SCL=8
	
	-DIR_TX_PINS='{{"Pin TX 1", 1}}'
	-DIR_RX_PINS='{{"Pin RX 2", 2}}'
	-DTXLED=48
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	
	-DRF_TX_PINS='{{"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DRF_RX_PINS='{{"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	
	-DSDCARD_CS=1
	-DSDCARD_SCK=40
	-DSDCARD_MISO=41
	-DSDCARD_MOSI=42
	
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER
	-DTFT_WIDTH=160
	-DTFT_HEIGHT=128
	-DST7735_GREENTAB3
	-DTFT_RGB_ORDER=TFT_BGR
	-DSMOOTH_FONT=1
	-DTFT_CS=45
	-DTFT_DC=21
	-DTFT_RST=14
	-DTFT_MOSI=42
	-DTFT_SCLK=40
	-DTFT_MISO=-1
	-DTFT_BL=2
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_SPI_PORT=FSPI
	
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1
	
	-DHAS_BTN=1
	-DBTN_ALIAS='"Mid"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW
	
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=21
	-DCC1101_SS_PIN=47
	-DCC1101_MOSI_PIN=42
	-DCC1101_SCK_PIN=40
	-DCC1101_MISO_PIN=41
	
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=21
	-DNRF24_SS_PIN=47
	-DNRF24_MOSI_PIN=42
	-DNRF24_SCK_PIN=40
	-DNRF24_MISO_PIN=41
	
	-DSPI_SCK_PIN=40
	-DSPI_MOSI_PIN=42
	-DSPI_MISO_PIN=41
	-DSPI_SS_PIN=47
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000
	
	-DJOY_X=12
	-DJOY_Y=13
	-DSEL_BTN=14
	
	-DBAT_PIN=10
lib_deps = ${env.lib_deps}
platform_packages = espressif/toolchain-xtensa-esp32s3@12.2.0+20230208
